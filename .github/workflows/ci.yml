name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Core, supervisor policy and tooling tests
        run: python3 tools/h2ctl.py check --profile core

  ros-jazzy:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      ROS_DOMAIN_ID: "72"
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install foundation build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake python3-colcon-common-extensions python3-pytest ros-jazzy-launch-ros ros-jazzy-tf2-ros ros-jazzy-ament-cmake-pytest
      - name: Build and test ROS packages
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 tools/h2ctl.py check --profile ros
      - name: Exercise mock motion and independent watchdogs
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/ros/setup.bash
          python3 tests/ros/test_motion_pipeline.py
          python3 tests/ros/test_launch_modes.py
      - name: Preserve build and smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jazzy-foundation-evidence
          path: |
            log/ros
            artifacts/ros-smoke
            artifacts/launch-check
          if-no-files-found: ignore
